# database connections using mysql
# NOTE: this url is also used by flyway to connect to the database
#NOTE: ${<ENVIRONMENT_VARIABLE:DEFAULT_VALUE} - use environment variable value if available else use provided default value
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:mysqldatabase}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:password}