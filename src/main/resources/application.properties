# Author: Jaydeep Dahiya
#enable application level debug logging
#debug=true

# logging pattern
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{yyyy-MM-dd HH:mm:ss}) %blue(%-5level) %red([%thread]) %yellow(%logger) - %cyan(%msg%n)}

# Show SQL - at lower Hibernate level. Use this if using other hibernate properties as well
spring.jpa.properties.hibernate.show_sql=true

#Format SQL
spring.jpa.properties.hibernate.format_sql=true

#Show bind values
# Pre Spring Boot 3.0.2
# logging.level.org.hibernate.type.descriptor.sql=trace
# Spring Boot 3.0.2+
logging.level.org.hibernate.orm.jdbc.bind=trace

# To disable the warning about database queries during view rendering
# spring.jpa.open-in-view is enabled by default. Therefore, database queries may be performed during view rendering. Explicitly configure spring.jpa.open-in-view to disable this warning
spring.jpa.open-in-view=false

# To disable the warning about SpringDocs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.jpa.hibernate.ddl-auto=validate

# database connections using h2
# h2 database url with file - for windows the file will be created in the main project folder
#mysqldatabase - file name, will be created and stored in project top level folder
#AUTO_SERVER=true - allows multiple connection to H2 database otherwise a single connection is allowed
spring.datasource.url=jdbc:h2:file:.\\mysqldatabase;AUTO_SERVER=true
spring.datasource.username=myadmin
spring.datasource.password=password

# To enable h2 console
spring.h2.console.enabled=true

# to customize the path for h2-console
spring.h2.console.path=/h2-console


##################################################################################
# All these properties are required for flyway to work properly on startup
##################################################################################
# to run flyway at startup, set spring.flyway.enabled=true. If you want to disable flyway, set spring.flyway.enabled=false
spring.flyway.enabled=true

# NOTE: url specified by spring.datasource.url is also used by flyway to connect to the database

# NOTE: by default flyway uses spring.datasource.username and spring.datasource.password.
# To override those values and use specific credentials for flyway, you can use the below properties.
# NOTE: DATABASE_ADMIN_USERNAME and DATABASE_ADMIN_PASSWORD are passed in as JVM properties from run configuration
# same can be also achieved by over-riding the specific properties via command line arguments --spring.flyway.user=myadmin --spring.flyway.password=password
spring.flyway.user=${DATABASE_ADMIN_USERNAME:myadmin}
spring.flyway.password=${DATABASE_ADMIN_PASSWORD:password}

# In a Spring Boot application using Flyway, SQL migration files are stored in src/main/resources/db/migration by default
# and must follow the naming pattern V__.sql, such as V1__Init.sql. It will take then in alphabetical order i.e. by no
# this is for custom path for flyway scripts
# If using multiple databasess with profile centric scripts then use following
# {vendor} is a Flyway location placeholder. Spring Boot passes spring.flyway.locations to Flyway, which connects to the
# configured database and determines the vendor from the JDBC connection metadata.
# NOTE: the folder name for the scripts should match the database type like h2 or MySQL (NOT THE PROFILE NAME). It
# will be picked by flyway from effective spring configured datasource type( i.e. as per application properties for
# specified # profile) and then the respective folder of sqls will be run.
spring.flyway.locations=classpath:flyway_sqls/common,classpath:flyway_sqls/{vendor}
# NOTE : The naming convention for migration scripts should still be followed, such as V1__Initial_setup.sql for versioned migrations.
